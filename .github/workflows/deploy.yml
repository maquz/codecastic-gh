name: Auto-Deploy to cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Build and Deploy to cPanel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: website/package-lock.json

      - name: Install Dependencies
        run: |
          cd website
          npm ci

      - name: Build Client and Server
        run: |
          cd website
          npm run build

      - name: Prepare Deployment Staging Directory
        run: |
          mkdir -p deploy_staging
          cp -r website/dist/* deploy_staging/
          mkdir -p deploy_staging/dist
          cp -r website/dist/* deploy_staging/dist/
          cp website/api.php deploy_staging/api.php
          cp website/app.js deploy_staging/app.js
          cp website/.htaccess deploy_staging/.htaccess
          if [ -f deploy.php ]; then cp deploy.php deploy_staging/deploy.php; fi

      - name: Upload to cPanel via FTP
        if: ${{ env.FTP_SERVER != '' }}
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: deploy_staging/
          server-dir: public_html/
